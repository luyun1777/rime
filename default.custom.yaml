# Rime setting
# encoding: utf-8

patch:
  schema_list:
    - { schema: wubi98 }
    - { schema: wubi86 }
  "ascii_composer/switch_key/Shift_L": commit_code
  "ascii_composer/switch_key/Shift_R": commit_code
  "menu/page_size": 3
  # "menu/alternative_select_labels": [㊀, ㊁, ㊂, ㊃, ㊄, ㊅, ㊆, ㊇, ㊈] # 自定义候选序号显示符，可自定修改，如要显示阿拉伯数字，直接注释掉这行（在前面加#号）
  #"menu/alternative_select_labels": [ ①,②,③,④,⑤,⑥,⑦,⑧,⑨,⑩ ]
  #"menu/alternative_select_labels": [ ❶,❷,❸,❹,❺,❻,❼,❽,❾,❿ ]
  #"menu/alternative_select_labels": [ ⓵,⓶,⓷,⓸,⓹,⓺,⓻,⓼,⓽,⓾ ]
  #"menu/alternative_select_labels": [ ㊀,㊁,㊂,㊃,㊄,㊅,㊆,㊇,㊈,㊉ ]
  #"menu/alternative_select_labels": [ ㈠,㈡,㈢,㈣,㈤,㈥,㈦,㈧,㈨,㈩ ]
  #"menu/alternative_select_labels": [ 🀇,🀈,🀉,🀊,🀋,🀌,🀍,🀎,🀏,🀄 ]
  #"menu/alternative_select_labels": [ Ⅰ,Ⅱ,Ⅲ,Ⅳ,Ⅴ,Ⅵ,Ⅶ,Ⅷ,Ⅸ,Ⅹ ]
  #"menu/alternative_select_labels": [ ⅰ,ⅱ,ⅲ,ⅳ,ⅴ,ⅵ,ⅶ,ⅷ,ⅸ,ⅹ ]
  #"menu/alternative_select_labels": [ Ⓐ,Ⓑ,Ⓒ,Ⓓ,Ⓔ,Ⓕ,Ⓖ,Ⓗ,Ⓘ,Ⓙ ]
  #"menu/alternative_select_labels": [ ⓐ,ⓑ,ⓒ,ⓓ,ⓔ,ⓕ,ⓖ,ⓗ,ⓘ,ⓙ ]
  "switcher/hotkeys":
    # - "Control+1"
    - "Control+grave"
    - "Control+Shift+grave"
  key_binder:
    bindings:
      # - {accept: comma, send: 2, when: has_menu}
      # - {accept: period, send: 3, when: has_menu}
      - { accept: semicolon, send: 2, when: has_menu } #  用分号选候选2
      - { accept: apostrophe, send: 3, when: has_menu } #  用单引号选候选3

      - { accept: minus, send: Page_Up, when: paging } # 减号向上翻页
      - { accept: equal, send: Page_Down, when: has_menu } # 等号向下翻页

      - { accept: Return, send: Escape, when: composing } # 回车清码

      - { when: always, accept: Shift+space, toggle: full_shape }
      - { when: always, accept: Control+period, toggle: ascii_punct }

      - { when: composing, accept: Shift+Tab, send: Up }
      - { when: composing, accept: Tab, send: Down }

      # emacs_editing:
      # - { when: composing, accept: Control+p, send: Up }
      # - { when: composing, accept: Control+n, send: Down }
      # - { when: composing, accept: Control+b, send: Left }
      # - { when: composing, accept: Control+f, send: Right }
      # - { when: composing, accept: Control+a, send: Home }
      # - { when: composing, accept: Control+e, send: End }
      # - { when: composing, accept: Control+d, send: Delete }
      # - { when: composing, accept: Control+k, send: Shift+Delete }
      # - { when: composing, accept: Control+h, send: BackSpace }
      # - { when: composing, accept: Control+g, send: Escape }
      # - { when: composing, accept: Control+bracketleft, send: Escape }
      # - { when: composing, accept: Control+y, send: Page_Up }
      # - { when: composing, accept: Alt+v, send: Page_Up }
      # - { when: composing, accept: Control+v, send: Page_Down }

      # 将小键盘 0~9 . 映射到主键盘，数字金额大写的 Lua 如 R1234.5678 可使用小键盘输入
      - { accept: KP_0, send: 0, when: composing }
      - { accept: KP_1, send: 1, when: composing }
      - { accept: KP_2, send: 2, when: composing }
      - { accept: KP_3, send: 3, when: composing }
      - { accept: KP_4, send: 4, when: composing }
      - { accept: KP_5, send: 5, when: composing }
      - { accept: KP_6, send: 6, when: composing }
      - { accept: KP_7, send: 7, when: composing }
      - { accept: KP_8, send: 8, when: composing }
      - { accept: KP_9, send: 9, when: composing }
      - { accept: KP_Decimal, send: period, when: composing }
      # 将小键盘 + - * / 映射到主键盘，使计算器 如 1+2-3*4 可使用小键盘输入
      - { accept: KP_Multiply, send: asterisk, when: composing }
      - { accept: KP_Add, send: plus, when: composing }
      - { accept: KP_Subtract, send: minus, when: composing }
      - { accept: KP_Divide, send: slash, when: composing }
      # 将小键盘回车映射到主键盘回车
      - { accept: KP_Enter, send: Return, when: composing }

  recognizer:
    patterns:
      email: "^[-_.0-9A-Za-z]+@.*$"
      expression: "^=.*$"
      punct: "^/([0-9]0?|[A-Za-z]+)$"
      reverse_lookup: "^z[a-z]*'?$"
      uppercase": "[A-Z][-_+.'0-9A-Za-z]*$"
      url: "^(www[.]|https?:|ftp[.:]|mailto:|file:|localhost).*$|^[a-z]+[.].+$"
